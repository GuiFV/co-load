# coload default configuration. `coload serve` reads this file as-is.
# The README's "What to change and why" section walks through every knob.
#
# Machine-specific setups: copy this to config.local.yaml (gitignored) and
# edit there; `coload serve` prefers it automatically. Keeps personal model
# lists and network choices out of the public repo.

gpu: 0                      # NVML index of the GPU to arbitrate

# Share of TOTAL VRAM always kept free as headroom (fragmentation, CUDA
# context growth, fluctuations from other processes). User-settable;
# defaults to 0.10 (10%). Must be >= 0 and < 1.
buffer_pct: 0.10

# Opt-in: lock a fixed slice of the card for coload's models. When set, the
# admission budget never falls below this figure minus what coload's own
# resident models are estimated to hold, however much out-of-band processes
# (a game, an editor, a browser) have taken. Use it when other GPU work on
# the box must never starve the models; leave it off to keep the purely
# measured budget, where the buffer above protects the desktop instead.
# Pairs with make_room below: admission is a promise, make_room is what
# physically clears the card to keep it.
# reserve_gb: 21

# Opt-in: when an admitted model does not physically fit the live
# measurement, briefly claim the bytes it needs so the OS pages out-of-band
# memory to system RAM, release them, and start the engine against a card
# that measures clean. Matters for engines that size themselves from a
# measurement before allocating anything (vLLM): they see the occupied card
# and refuse their own start. Only the OS's paging is used; out-of-band
# processes lose performance, never correctness, and nothing is evicted.
# Off (the default) refuses a physical shortfall cleanly, with an alert.
# make_room: true

idle_ttl_seconds: 900       # stop a backend after this long idle (0 disables)
watchdog_interval_s: 10     # how often the watchdog polls total VRAM

# Opt-in: when a request doesn't fit, evict models COLOAD ITSELF loaded
# (least-recently-used first) to make room before refusing. Out-of-band GPU
# users are never evicted, only alerted about. Enable for workloads that
# alternate between models too big to co-reside on the card.
auto_evict_idle: false

# Safe default: only this machine can reach the gateway. If you need WSL
# (NAT mode) or other machines to reach it, set "0.0.0.0" in your
# config.local.yaml and mind that this exposes the gateway without auth.
host: "127.0.0.1"
port: 8800                  # gateway port

# Learned VRAM estimates are cached here after real loads refine the seeds.
estimates_path: ".coload/learned_estimates.json"

# The gateway's own record: every load, refusal and eviction, in a rotating
# file, so a decision made while nobody was watching can still be read later.
# The console gets the same lines either way. `path: null` disables the file.
log:
  path: ".coload/coload.log"
  level: "INFO"
  max_bytes: 10485760       # rotate at 10 MiB
  backup_count: 5           # keep this many rotated files

alert:
  channels: [log]           # add "webhook" to POST alerts as JSON
  # webhook_url: "http://localhost:9999/alert"

engines:
  # Works out of the box if the Ollama daemon is running (default port).
  # Swap the model names for ones you have pulled (`ollama list`).
  ollama:
    kind: ollama
    base_url: "http://localhost:11434"
    # How long Ollama itself keeps a loaded model pinned. A backstop, not a
    # policy: coload evicts at idle_ttl_seconds, long before this fires. It
    # only matters when coload is not around to evict — a crash or restart
    # loses the in-memory table its eviction paths iterate, and a model
    # pinned indefinitely then holds VRAM nothing can reclaim short of
    # restarting the daemon. Must exceed idle_ttl_seconds.
    pin_ttl_seconds: 3600
    models:
      "llama3.2": { est_vram_gb: 3 }
      "nomic-embed-text": { est_vram_gb: 1 }

  # Works out of the box with Docker + the bundled docker-compose.yaml.
  # coload exports COLOAD_MODEL and COLOAD_BUDGET_FRAC (the live budget,
  # measured right before the load) and compose interpolates them.
  vllm:
    kind: vllm
    # Must match the host port the compose service publishes. Setting
    # COLOAD_VLLM_PORT in .env without changing this leaves coload polling a
    # port nothing listens on, which surfaces as a health-check timeout.
    base_url: "http://localhost:8000"
    # How long to wait for a started engine to answer /health. The default
    # suits a small model. A large one is slower than it looks: weights have
    # to be read, the KV cache profiled and CUDA graphs captured before the
    # first request is served, and a 20 GiB quantised checkpoint can take
    # several minutes. Too low tears the engine down and reports a timeout,
    # which reads like a broken engine rather than an impatient one.
    health_timeout_seconds: 180
    start: "docker compose up -d vllm"
    stop: "docker compose stop vllm"
    models:
      # Unlike Ollama, vLLM takes the slice it is handed and holds it, so
      # this figure is a real allocation rather than a first guess: coload
      # never refines it from observation. Size it to weights plus the KV
      # cache you want, because too small starves batching.
      "Qwen/Qwen2.5-0.5B-Instruct": { est_vram_gb: 2 }

  # Bare-metal alternative (vllm installed on the host, no docker):
  # {model} and {budget_frac} are filled in by coload at load time.
  # `stop` is optional here; without it coload terminates the process it
  # started, which is exactly right for a non-detached `vllm serve`.
  # vllm-bare:
  #   kind: vllm
  #   base_url: "http://localhost:8001"
  #   start: "vllm serve {model} --gpu-memory-utilization {budget_frac} --port 8001"
  #   models:
  #     "Qwen/Qwen2.5-7B-Instruct": { est_vram_gb: 16 }
